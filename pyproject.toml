[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zombie-outbreak"
version = "0.1.0"
description = "Two-survivor zombie outbreak grid game for benchmarking world models and planning agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "pygame>=2.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
model = ["torch>=2.1"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["env*", "agents*", "world_model*", "experiments*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
